<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pay Securely — Agentic Commerce</title>
  <meta name="description" content="Secure one-click checkout powered by Razorpay. Complete your payment safely.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%230a5743' d='M20 20h25v25H20zM55 20h25v25H55zM20 55h25v25H20zM55 55h25v25H55z'/%3E%3Cpath fill='%230a5743' d='M35 35l30 30-10 10-30-30z'/%3E%3C/svg%3E" />

  <!-- Razorpay Checkout SDK (must load before any payment code) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ─── Design Tokens ──────────────────────────────────────────────────────── */
    :root {
      --brand: #0a5743;
      --brand-dark: #07402f;
      --brand-light: #e8f5f0;
      --accent: #10b981;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --warning: #f59e0b;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --surface: #ffffff;
      --bg: #f0f4f8;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow-card: 0 4px 24px rgba(10, 87, 67, 0.10), 0 1px 4px rgba(10, 87, 67, 0.06);
    }

    /* ─── Reset & Base ───────────────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    /* ─── Card ───────────────────────────────────────────────────────────────── */
    .pay-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }

    /* Card header strip */
    .pay-header {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      padding: 28px 32px 24px;
      color: #fff;
      position: relative;
    }

    .pay-header .brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 10px;
    }

    .pay-header h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
    }

    .pay-header .lock-badge {
      position: absolute;
      top: 28px;
      right: 28px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    /* Card body */
    .pay-body {
      padding: 28px 32px 32px;
    }

    /* Order summary */
    .order-summary {
      background: var(--brand-light);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-summary .label {
      font-size: 14px;
      color: var(--brand-dark);
      font-weight: 500;
    }

    .order-summary .amount {
      font-size: 22px;
      font-weight: 800;
      color: var(--brand);
    }

    /* Form fields */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(10, 87, 67, 0.12);
    }

    /* Pay button */
    #pay-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.2px;
    }

    #pay-btn:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    #pay-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    #pay-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Status banner */
    #status-banner {
      display: none;
      border-radius: 8px;
      padding: 14px 18px;
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      animation: fadeSlide 0.3s ease;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #status-banner.success {
      background: #ecfdf5;
      border: 1.5px solid #6ee7b7;
      color: #065f46;
    }

    #status-banner.error {
      background: var(--danger-bg);
      border: 1.5px solid #fca5a5;
      color: #991b1b;
    }

    #status-banner .status-icon {
      font-size: 18px;
      margin-right: 6px;
      vertical-align: -2px;
    }

    /* Detail rows inside success banner */
    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 8px;
      color: #047857;
    }

    .detail-row .key {
      opacity: 0.75;
    }

    .detail-row .val {
      font-weight: 600;
      word-break: break-all;
      text-align: right;
      max-width: 60%;
    }

    /* Trust badges */
    .trust-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    .trust-row .badge {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .pay-header {
        padding: 22px 20px 18px;
      }

      .pay-body {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="pay-card" role="main">

    <!-- Header -->
    <div class="pay-header">
      <div class="brand">Agentic Commerce</div>
      <h1>Complete your<br>payment</h1>
      <div class="lock-badge" aria-label="Secure payment">🔒</div>
    </div>

    <!-- Body -->
    <div class="pay-body">

      <!-- Order summary pulled from URL query params or defaults -->
      <div class="order-summary" id="order-summary">
        <div class="label">Total due</div>
        <div class="amount" id="display-amount">₹0.00</div>
      </div>

      <!-- Prefill form (optional — Razorpay also collects this) -->
      <div class="field-group">
        <div class="field">
          <label for="pf-name">Full name</label>
          <input id="pf-name" type="text" placeholder="Sakshi Chauhan" autocomplete="name">
        </div>
        <div class="field">
          <label for="pf-email">Email address</label>
          <input id="pf-email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="pf-contact">Mobile number</label>
          <input id="pf-contact" type="tel" value="+919999999999" placeholder="+919999999999" autocomplete="tel"
            maxlength="15">
        </div>
      </div>

      <!-- CTA -->
      <button id="pay-btn" type="button">
        <span id="btn-icon">⚡</span>
        <span id="btn-label">Pay Now</span>
        <span class="btn-spinner" id="btn-spinner" aria-hidden="true"></span>
      </button>

      <!-- Status feedback -->
      <div id="status-banner" role="alert" aria-live="polite"></div>

      <!-- Trust row -->
      <div class="trust-row">
        <span class="badge">🛡️ 256-bit SSL</span>
        <span class="badge">✅ Razorpay Secured</span>
        <span class="badge">🔐 Signature Verified</span>
      </div>
    </div>
  </div>

  <script>
    /**
     * payment.js (inline) — Razorpay Checkout Integration
     *
     * Flow:
     *  1. User fills name/email/contact and clicks "Pay Now"
     *  2. We POST to /api/payment/order to get a Razorpay order_id (server-side amount)
     *  3. We open the Razorpay checkout modal
     *  4. On success, we POST { razorpay_order_id, razorpay_payment_id, razorpay_signature }
     *     to /api/payment/verify
     *  5. Show user-friendly success or failure feedback
     *
     * Security notes:
     *  - Amount is NEVER set on the client; the server owns it.
     *  - RAZORPAY_KEY_ID is public; RAZORPAY_KEY_SECRET is server-only.
     *  - Signature is always verified server-side (timingSafeEqual HMAC).
     */

    'use strict';

    // ─── Config pulled from URL params (for flexibility) ───────────────────────
    // Usage: /payment.html?amount=129900&description=Wireless+Mouse
    // amount must already be in paise.
    const params = new URLSearchParams(window.location.search);
    const AMOUNT_PAISE = parseInt(params.get('amount') || '129900', 10); // default ₹1,299
    const DESCRIPTION = params.get('description') || 'Agentic Commerce Purchase';

    // ─── Display amount ─────────────────────────────────────────────────────────
    document.getElementById('display-amount').textContent =
      new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0 })
        .format(AMOUNT_PAISE / 100);

    // ─── Helpers ────────────────────────────────────────────────────────────────
    const payBtn = document.getElementById('pay-btn');
    const btnLabel = document.getElementById('btn-label');
    const btnIcon = document.getElementById('btn-icon');
    const btnSpinner = document.getElementById('btn-spinner');
    const statusEl = document.getElementById('status-banner');

    /**
     * Reads the auth token stored by app.js login flow.
     * Falls back to null if the user is not signed in.
     */
    function getAuthToken() {
      return localStorage.getItem('token') || sessionStorage.getItem('token') || null;
    }

    function setLoading(loading) {
      payBtn.disabled = loading;
      btnLabel.textContent = loading ? 'Processing…' : 'Pay Now';
      btnIcon.style.display = loading ? 'none' : 'inline';
      btnSpinner.style.display = loading ? 'inline-block' : 'none';
    }

    function showStatus(type, html) {
      statusEl.className = type;              // 'success' | 'error'
      statusEl.innerHTML = html;
      statusEl.style.display = 'block';
      statusEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function clearStatus() {
      statusEl.style.display = 'none';
      statusEl.innerHTML = '';
    }

    /**
     * POST helper with auth header and JSON body.
     * Throws on network error; returns parsed JSON on any HTTP status.
     */
    async function apiPost(url, body) {
      const token = getAuthToken();
      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      return { ok: res.ok, status: res.status, data };
    }

    // ─── Main payment handler ────────────────────────────────────────────────────
    async function handlePay() {
      clearStatus();

      const name = document.getElementById('pf-name').value.trim();
      const email = document.getElementById('pf-email').value.trim();
      const contact = document.getElementById('pf-contact').value.trim();

      // Basic client-side validation (Razorpay also validates)
      if (!name) return showStatus('error', '<span class="status-icon">⚠️</span> Please enter your full name.');
      if (!email || !email.includes('@'))
        return showStatus('error', '<span class="status-icon">⚠️</span> Please enter a valid email address.');

      setLoading(true);

      // ── Step 1: Create server-side order ──────────────────────────────────────
      let orderId, amountFromServer, currency;

      try {
        const { ok, data } = await apiPost('/api/payment/order', {
          amountInPaise: AMOUNT_PAISE,
          notes: { description: DESCRIPTION },
        });

        if (!ok || !data.orderId) {
          setLoading(false);
          return showStatus('error',
            `<span class="status-icon">❌</span> ${data.error || 'Could not initiate payment. Please try again.'}`
          );
        }

        orderId = data.orderId;
        amountFromServer = data.amount;   // use server amount — never trust client
        currency = data.currency;
      } catch (err) {
        setLoading(false);
        return showStatus('error',
          '<span class="status-icon">❌</span> Network error. Check your connection and try again.'
        );
      }

      // ── Step 2: Open Razorpay modal ───────────────────────────────────────────
      const rzpOptions = {
        // KEY_ID is public — safe to embed in frontend HTML
        // Replace with your actual KEY_ID; the server does NOT expose it via API.
        key: 'rzp_test_xxxxxxxxxxxx', // ← replace with window.__RZP_KEY__ if injected by server

        amount: amountFromServer,     // paise from server — authoritative
        currency,
        name: 'Agentic Commerce',
        description: DESCRIPTION,
        order_id: orderId,

        prefill: { name, email, contact },
        readonly: {
          contact: true,
          email: true
        },

        theme: { color: '#0a5743' },

        modal: {
          ondismiss() {
            setLoading(false);
            showStatus('error',
              '<span class="status-icon">🚫</span> Payment cancelled. You can try again whenever you are ready.'
            );
          },
        },

        // ── Step 3: On success — verify server-side ───────────────────────────
        handler: async function (response) {
          const { razorpay_order_id, razorpay_payment_id, razorpay_signature } = response;

          try {
            const { ok, data } = await apiPost('/api/payment/verify', {
              razorpay_order_id,
              razorpay_payment_id,
              razorpay_signature,
            });

            if (ok && data.success) {
              // ✅ Payment verified
              payBtn.style.display = 'none';
              showStatus('success', `
                <strong><span class="status-icon">✅</span> Payment Successful!</strong>
                <div class="detail-row">
                  <span class="key">Payment ID</span>
                  <span class="val">${razorpay_payment_id}</span>
                </div>
                <div class="detail-row">
                  <span class="key">Order ID</span>
                  <span class="val">${razorpay_order_id}</span>
                </div>
                <div class="detail-row" style="margin-top:12px; color:#065f46;">
                  <span>Your order has been confirmed. Thank you!</span>
                </div>
              `);
            } else {
              // ❌ Signature mismatch
              setLoading(false);
              showStatus('error', `
                <strong><span class="status-icon">⚠️</span> Verification Failed</strong><br>
                ${data.error || 'Signature mismatch — this payment cannot be accepted.'}
                Please contact support with your payment ID: <strong>${razorpay_payment_id}</strong>
              `);
            }
          } catch (_) {
            setLoading(false);
            showStatus('error',
              `<span class="status-icon">❌</span> Verification request failed. Contact support with payment ID: <strong>${razorpay_payment_id}</strong>`
            );
          }
        },
      };

      const rzp = new Razorpay(rzpOptions);

      rzp.on('payment.failed', function (response) {
        setLoading(false);
        const desc = response.error?.description ?? 'The payment could not be completed.';
        const reason = response.error?.reason ?? '';
        showStatus('error',
          `<span class="status-icon">❌</span> <strong>Payment Failed</strong><br>${desc}${reason ? ` (${reason})` : ''}`
        );
      });

      rzp.open();
    }

    // ─── Event listeners ─────────────────────────────────────────────────────────
    document.getElementById('pay-btn').addEventListener('click', handlePay);

    // Pre-fill from logged-in user if available (set by app.js)
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const userJson = localStorage.getItem('user');
        if (userJson) {
          const user = JSON.parse(userJson);
          if (user.name) document.getElementById('pf-name').value = user.name;
          if (user.email) document.getElementById('pf-email').value = user.email;
        }
      } catch (_) { /* ignore */ }
    });
  </script>
</body>

</html>
